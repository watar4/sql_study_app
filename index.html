<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>BigQuery SQL 学習アプリ</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://tswuvheiwnxrykpkkiii.supabase.co">
</head>
<body>
<div id="login-overlay" style="display:none">
  <div class="login-box">
    <h1>📚 BigQuery SQL 学習</h1>
    <p class="login-subtitle">続けるには Google でログインしてください</p>
    <button id="google-login-btn">
      <span class="g-icon">G</span>
      <span>Google でログイン</span>
    </button>
    <p class="login-note">ログインすると進捗が保存され、別のPCでも続きから学習できます。</p>
  </div>
</div>

<div id="init-loading">
  <div class="spinner"></div>
  <p>初期化中...</p>
</div>

<div id="name-setup-overlay" style="display:none">
  <div class="login-box" style="max-width:440px">
    <h1>👋 ようこそ!</h1>
    <p class="login-subtitle">ダッシュボードで表示される<b>表示名</b>を設定してください</p>
    <input id="display-name-input" type="text" placeholder="山田 太郎" maxlength="40" autocomplete="off">
    <button id="save-name-btn" style="background:#a6e3a1;color:#1e1e2e;border:none;padding:11px 28px;border-radius:6px;font-weight:700;cursor:pointer;font-size:14px;margin-top:16px;font-family:inherit">
      保存して始める
    </button>
    <p class="login-note">あとから変更できます。会社で使う場合はフルネーム推奨。</p>
  </div>
</div>

<div id="app" style="display:none">
  <aside id="sidebar">
    <h1>BQ SQL 学習</h1>
    <button id="home-btn" class="sidebar-nav-btn">🏠 ホーム</button>
    <button id="review-btn" class="sidebar-nav-btn">📝 振り返り <span class="count-badge" id="review-count"></span></button>
    <div id="user-info" style="display:none">
      <div class="user-name" id="user-display"></div>
      <button id="logout-btn" class="link-btn">ログアウト</button>
    </div>
    <div id="progress">読み込み中...</div>
    <button id="show-cheatsheet" class="sidebar-nav-btn">📘 BQ/SQLite 文法対応表</button>
    <nav id="problem-list"></nav>
  </aside>
  <main id="main">
    <div id="home-view" style="display:none">
      <div class="home-header">
        <h1>BigQuery SQL 学習</h1>
        <p>鉄道・物販データの問題で BigQuery 流の SQL を体得する</p>
      </div>
      <div class="overall-progress">
        <div class="progress-stat">
          <div class="big-number" id="big-progress-num">0 / 0</div>
          <div class="stat-label">問解答済</div>
        </div>
        <div style="flex:1">
          <div class="progress-bar-large">
            <div class="progress-fill" id="overall-progress-fill" style="width:0%"></div>
          </div>
          <div class="stat-label" id="overall-progress-pct" style="text-align:right;margin-top:6px">0%</div>
        </div>
      </div>
      <h2 class="section-title">📚 章一覧 (クリックで開始)</h2>
      <div class="chapter-grid" id="chapter-grid"></div>
    </div>
    <div id="problem-view" style="display:none">
      <div id="problem-header">
        <div class="tags">
          <span class="category"></span>
          <span class="difficulty"></span>
        </div>
        <h2 class="title"></h2>
      </div>
      <div id="description"></div>
      <div id="schema"></div>
      <div class="editor-label">あなたの SQL:</div>
      <textarea id="editor" placeholder="ここに SQL を書いて Ctrl+Enter で実行" spellcheck="false"></textarea>
      <div id="buttons">
        <button id="run-btn">▶ 実行 (Ctrl+Enter)</button>
        <button id="hint-btn" class="secondary">💡 ヒントを見る</button>
        <button id="answer-btn" class="secondary">模範解答を見る</button>
        <button id="reset-btn" class="secondary">リセット</button>
      </div>
      <div id="status"></div>
      <div id="review-prompt" style="display:none">
        <button id="add-review-btn">📝 振り返りに登録</button>
      </div>
      <div id="translation-notice" style="display:none"></div>
      <div id="result"></div>
      <div id="expected"></div>
      <div id="hints"></div>
      <div id="bq-notes"></div>
    </div>
    <div id="review-view" style="display:none">
      <div class="home-header">
        <h1>📝 振り返り</h1>
        <p>間違えて登録した問題に再挑戦できます</p>
      </div>
      <div id="review-list-container"></div>
    </div>
    <div id="cheatsheet" style="display:none"></div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script type="module" src="app.js"></script>
</body>
</html>
